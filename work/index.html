<html lang="zh-CN">
<head>

  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>打工模拟器 v4.0 - 坤城篇 (Web版)</title>
  
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TR4FT7JPDZ"></script>

<!-- GA4 统一埋点模块 -->
<script src="../js/js/gtag-config.js"></script>

    <link rel="stylesheet" href="../css/css/work-index.css">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="7c64c1b7-5571-40ec-9a62-576686340c0b"></script>
</head>
<body>
  <div id="terminal" class="terminal-container">
    <div class="terminal-header">
      <div class="terminal-dots">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow"></div>
        <div class="terminal-dot dot-green"></div>
      </div>
      <div class="terminal-title">打工模拟器 v4.0 - 坤城篇 · Web版</div>
    </div>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <div id="statusText">正在加载游戏引擎...</div>
    </div>
    <div id="output"><span style="color:#555;">正在加载游戏引擎...</span></div>
    <div class="input-area">
      <input id="inputField" type="text" placeholder="在此输入，按 Enter 发送..." disabled autocomplete="off" />
      <button id="sendBtn" disabled>发送</button>
    </div>
  </div>

  
  <script async type="text/javascript" src="打工模拟器.js"></script>
  <div id="canvas" style="display:none;"></div>
    <script src="../js/js/work-index.js"></script>



</body>
