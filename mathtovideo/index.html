<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>塔珀自指公式 · 像素动画工坊</title>
<meta name="description" content="基于塔珀自指公式的106×17像素画板与帧动画工具">
<style>
:root {
    --primary: #3366ff;
    --blue: #2575fc;
    --dark: #1D1D1F;
    --gray: #515154;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e0e4e8;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    color: var(--dark);
    min-height: 100vh;
    padding: 16px;
    overflow-x: hidden;
}
.container { max-width: 1500px; margin: 0 auto; }

/* ===== Header ===== */
header {
    text-align: center;
    padding: 16px 16px 12px;
}
header h1 {
    font-size: 1.5rem;
    background: linear-gradient(135deg, var(--primary), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
}
.formula {
    font-family: 'Times New Roman', serif;
    font-size: 0.92rem;
    color: var(--gray);
    background: rgba(255,255,255,0.6);
    display: inline-block;
    padding: 5px 16px;
    border-radius: var(--radius);
    backdrop-filter: blur(4px);
    line-height: 1.6;
}

/* ===== Grid ===== */
.main-grid {
    display: grid;
    grid-template-columns: 1fr 370px;
    gap: 16px;
    margin-top: 12px;
}
@media (max-width: 1100px) {
    .main-grid { grid-template-columns: 1fr; }
}

/* ===== Canvas Area ===== */
.canvas-area {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.canvas-area .section-title {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--gray);
}
.canvas-area .section-title small {
    font-weight: 400;
    font-size: 0.76rem;
    color: var(--gray);
}

/* Viewport */
.viewport {
    position: relative;
    width: 100%;
    overflow: hidden;
    border: 2px solid var(--border);
    border-radius: 6px;
    background: #1a1a1a;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}
.viewport .inner {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
}
.viewport canvas {
    display: block;
    image-rendering: pixelated;
}
#gc { position: absolute; top: 0; left: 0; pointer-events: none; }
/* grid is drawn on pc directly, no separate grid canvas needed */

/* Zoom bar */
.zoom-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
}
.zoom-bar .lbl { font-size: 0.78rem; color: var(--gray); }
#zoomDisp {
    font-weight: 600;
    font-family: monospace;
    font-size: 0.82rem;
    color: var(--primary);
    min-width: 44px;
    text-align: center;
}
#coordDisp {
    font-family: monospace;
    font-size: 0.78rem;
    color: var(--gray);
    margin-left: auto;
}

/* Toolbar */
.tbar {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
}
.tbar .lbl { font-size: 0.78rem; color: var(--gray); font-weight: 500; }
.tbar .sep { width: 1px; height: 20px; background: var(--border); display: inline-block; margin: 0 3px; }

/* ===== Buttons ===== */
.btn {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #fff;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.12s;
    color: var(--dark);
    white-space: nowrap;
    line-height: 1.4;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.btn-pri {
    background: linear-gradient(135deg, var(--primary), var(--blue));
    color: #fff;
    border: none;
}
.btn-pri:hover { opacity: 0.88; }
.btn-dng {
    background: #e74c3c;
    color: #fff;
    border: none;
}
.btn-dng:hover { opacity: 0.88; }
.btn-sm { padding: 3px 8px; font-size: 0.76rem; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== Right Panel ===== */
.rpanel {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.box {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px;
}
.box label {
    font-size: 0.8rem;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
}
.box label small { font-weight: 400; color: var(--gray); }

textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    resize: vertical;
    min-height: 44px;
    background: #f8f9fb;
    color: var(--dark);
}
textarea:focus { outline: none; border-color: var(--primary); }

.inrow {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
}
.inrow:last-child { margin-bottom: 0; }
.inrow input[type="number"] {
    flex: 1;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 0.8rem;
}
.inrow input[type="number"]:focus { outline: none; border-color: var(--primary); }
.inrow input[type="range"] {
    flex: 1;
    accent-color: var(--primary);
}
#fpsV { min-width: 24px; text-align: center; font-weight: 600; font-size: 0.82rem; }

.brow {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}
.brow .btn { flex: 1; min-width: 50px; }

/* ===== Frame List ===== */
#flist {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
    min-height: 30px;
}
.fitem {
    position: relative;
    width: 64px;
    height: 16px;
    border: 2px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.12s;
}
.fitem:hover { border-color: var(--primary); }
.fitem canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.fitem .fdel {
    position: absolute;
    top: -5px; right: -5px;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #e74c3c; color: #fff;
    border: none; font-size: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.12s;
}
.fitem:hover .fdel { opacity: 1; }
.fitem .fidx {
    position: absolute;
    bottom: 1px; left: 2px;
    font-size: 7px;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.5);
    padding: 0 2px;
    border-radius: 2px;
}
.empty-frames { color: var(--gray); font-size: 0.78rem; padding: 5px 0; }

/* ===== Progress ===== */
#eprog { display: none; margin-top: 6px; }
#eprog.show { display: block; }
.pbar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.pfill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--blue)); border-radius: 2px; transition: width 0.3s; }
.ptxt { font-size: 0.74rem; color: var(--gray); margin-top: 3px; }

/* ===== Misc ===== */
.info { font-size: 0.72rem; color: var(--gray); line-height: 1.5; margin-top: 4px; }
.sdot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 3px; }
.sdot.grn { background: #2ed573; }
.sdot.red { background: #e74c3c; }
#fcnt { font-weight: 600; color: var(--primary); }
.back {
    display: inline-block;
    margin-top: 16px;
    color: var(--primary);
    text-decoration: none;
    font-size: 0.82rem;
    padding: 5px 12px;
    border-radius: var(--radius);
    background: rgba(255,255,255,0.6);
    transition: background 0.12s;
}
.back:hover { background: rgba(255,255,255,0.9); }

/* Toast */
.toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: #333; color: #fff;
    padding: 7px 18px;
    border-radius: 7px;
    font-size: 0.8rem;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
}
.toast.show { opacity: 1; }

<body>

<div class="container">
<header>
    <h1>🧮 塔珀自指公式 · 像素动画工坊</h1>
    <div class="formula">
        ½ &lt; ⌊mod(⌊y/17⌋ · 2<sup>−17⌊x⌋ − mod(⌊y⌋,17)</sup>, 2)⌋
    </div>
</header>

<div class="main-grid">
    <!-- LEFT: Canvas -->
    <div class="canvas-area">
        <div class="section-title">
            🎨 画板
            <small>· 滚轮缩放 · 拖拽平移 · 点击绘制</small>

            <span class="lbl">缩放：</span>

<script>
// ============================================================
//  CONST
// ============================================================
const C = 106, R = 17, S = 10; // cols, rows, cell size
const LW = C * S, LH = R * S;

// ============================================================
//  STATE
// ============================================================
let px = Array.from({length:R}, () => Array(C).fill(0));
let frames = [];
let tool = 'draw';
let painting = false;
let panMode = false;
let lastCol = -1, lastRow = -1;
let zoom = 1, panX = 0, panY = 0;
let panning = false, pSX, pSY, pSPX, pSPY;

// ============================================================
//  DOM
// ============================================================
const vp = document.getElementById('vp');
const inner = document.getElementById('inner');
const pc = document.getElementById('pc');
const gc = document.getElementById('gc');
const cx = pc.getContext('2d');

const $ = id => document.getElementById(id);
const kt = $('kt');
const toast = $('toast');

// ============================================================
//  VIEWPORT SIZING
// ============================================================
function szVP() {
    const w = vp.clientWidth;
    vp.style.height = Math.max(200, Math.min(480, w * LH / LW * 2.5)) + 'px';
}
window.addEventListener('resize', szVP);

// ============================================================
//  ZOOM / PAN
// ============================================================
function xf() {
    inner.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    $('zoomDisp').textContent = Math.round(zoom * 100) + '%';
}

function zAt(d, cx, cy) {
    const o = zoom;
    zoom = Math.max(0.2, Math.min(10, zoom + d));
    if (cx !== void 0) {
        panX = cx - (cx - panX) * zoom / o;
        panY = cy - (cy - panY) * zoom / o;
    }
    xf();
}

$('zi').onclick = () => zAt(0.5, vp.clientWidth/2, vp.clientHeight/2);
$('zo').onclick = () => zAt(-0.5, vp.clientWidth/2, vp.clientHeight/2);
$('zf').onclick = () => {
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const z = Math.min(vw / LW, vh / LH) * 0.92;
    zoom = z;
    panX = (vw - LW * z) / 2;
    panY = (vh - LH * z) / 2;
    xf();
};

vp.onwheel = e => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    zAt(e.deltaY < 0 ? 0.4 : -0.4, e.clientX - r.left, e.clientY - r.top);
};

// ============================================================
//  LOGICAL COORDS
// ============================================================
function lc(e) {
    const r = vp.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const lx = (mx - panX) / zoom, ly = (my - panY) / zoom;
    return { col: Math.floor(lx / S), row: Math.floor(ly / S), lx, ly };
}
function inside(lx, ly) { return lx >= 0 && lx < LW && ly >= 0 && ly < LH; }

// ============================================================
//  BRESENHAM LINE — fill every cell between two points
// ============================================================
function linePixels(r0, c0, r1, c1, fn) {
    let dr = r1 - r0, dc = c1 - c0;
    const steps = Math.max(Math.abs(dr), Math.abs(dc));
    if (steps === 0) { fn(r0, c0); return; }
    const sR = dr / steps, sC = dc / steps;
    let r = r0, c = c0;
    for (let i = 0; i <= steps; i++) {
        fn(Math.round(r), Math.round(c));
        r += sR; c += sC;
    }
}

function paint(r, c) {
    if (r < 0 || r >= R || c < 0 || c >= C) return;
    if (tool === 'draw') px[r][c] = 1;
    else if (tool === 'erase') px[r][c] = 0;
    else if (tool === 'toggle') px[r][c] = px[r][c] ? 0 : 1;
    cx.fillStyle = px[r][c] === 1 ? '#fff' : '#000';
    cx.fillRect(c * S, r * S, S, S);
    // Redraw grid lines on this cell
    cx.strokeStyle = 'rgba(200,200,200,0.25)';
    cx.lineWidth = 0.5;
    cx.beginPath(); cx.moveTo(c*S, r*S); cx.lineTo((c+1)*S, r*S); cx.stroke();
    cx.beginPath(); cx.moveTo(c*S, (r+1)*S); cx.lineTo((c+1)*S, (r+1)*S); cx.stroke();
    cx.beginPath(); cx.moveTo(c*S, r*S); cx.lineTo(c*S, (r+1)*S); cx.stroke();
    cx.beginPath(); cx.moveTo((c+1)*S, r*S); cx.lineTo((c+1)*S, (r+1)*S); cx.stroke();
}

function drawTo(r, c) {
    if (lastCol >= 0 && lastRow >= 0) {
        linePixels(lastRow, lastCol, r, c, (rr, cc) => paint(rr, cc));
    } else {
        paint(r, c);
    }
    lastCol = c; lastRow = r;
    updateK();
}

function handle(e) {
    const { col, row, lx, ly } = lc(e);
    $('coordDisp').textContent = inside(lx, ly) ? `(${col}, ${row})` : '( - , - )';
    if (!inside(lx, ly)) return;
    if (painting) drawTo(row, col);
}

// ============================================================
//  MOUSE
// ============================================================
vp.onmousedown = e => {
    if (e.button !== 0) return;
    if (panMode) {
        panning = true;
        pSX = e.clientX; pSY = e.clientY;
        pSPX = panX; pSPY = panY;
        vp.style.cursor = 'grabbing';
        return;
    }
    painting = true;
    lastCol = -1; lastRow = -1;
    handle(e);
};
vp.onmousemove = e => {
    if (panning) {
        panX = pSPX + (e.clientX - pSX);
        panY = pSPY + (e.clientY - pSY);
        xf(); return;
    }
    handle(e);
};
vp.onmouseup = () => { painting = false; panning = false; vp.style.cursor = panMode ? 'grab' : 'crosshair'; };
vp.onmouseleave = () => { painting = false; panning = false; $('coordDisp').textContent = '( - , - )'; };

// Touch
vp.ontouchstart = e => {
    if (e.touches.length !== 1 || panMode) return;
    e.preventDefault();
    painting = true; lastCol = -1; lastRow = -1;
    handle(e.touches[0]);
};
vp.ontouchmove = e => {
    e.preventDefault();
    if (painting && !panMode && e.touches.length === 1) handle(e.touches[0]);
};
vp.ontouchend = () => { painting = false; };

// ============================================================
//  TOOL SELECTION
// ============================================================
document.querySelectorAll('[data-t]').forEach(b => {
    b.onclick = () => {
        document.querySelectorAll('[data-t]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        tool = b.dataset.t;
        if (panMode) { panMode = false; $('panBtn').classList.remove('active'); vp.style.cursor = 'crosshair'; }
    };
});
$('panBtn').onclick = () => {
    panMode = !panMode;
    $('panBtn').classList.toggle('active', panMode);
    vp.style.cursor = panMode ? 'grab' : 'crosshair';
    if (panMode) painting = false;
};

// ============================================================
//  TUPPER
// ============================================================
function enc(p) {
    let n = 0n;
    for (let x = 0; x < C; x++)
        for (let r = 0; r < R; r++)
            if (p[r][x] === 1) n |= (1n << BigInt(17 * x + (R - 1 - r)));
    return n * 17n;
}
function dec(k) {
    const p = Array.from({length:R}, () => Array(C).fill(0));
    const n = k / 17n;
    for (let x = 0; x < C; x++)
        for (let r = 0; r < R; r++)
            p[R - 1 - r][x] = Number((n >> BigInt(17 * x + r)) & 1n);
    return p;
}

// ============================================================
//  RENDER
// ============================================================
function render() {
    for (let r = 0; r < R; r++)
        for (let c = 0; c < C; c++) {
            cx.fillStyle = px[r][c] === 1 ? '#fff' : '#000';
            cx.fillRect(c * S, r * S, S, S);
        }
    drawGrid();
    updateK();
}
function drawGrid() {
    cx.strokeStyle = 'rgba(200,200,200,0.25)';
    cx.lineWidth = 0.5;

function sv(p) { frames.push({pixels: p.map(r => [...r])}); upFr(); }

function delFr(i) { frames.splice(i,1); upFr(); }

function upFr() {
    $('fcnt').textContent = frames.length;
    const fl = $('flist');
    fl.innerHTML = '';
    if (!frames.length) {
        fl.innerHTML = '<p class="empty-frames">还没有保存帧～</p>';
        $('exGif').disabled = true; $('exMp4').disabled = true; $('playBtn').disabled = true;
        return;
    }
    $('exGif').disabled = false; $('exMp4').disabled = false; $('playBtn').disabled = false;
    frames.forEach((fr, i) => {
        const d = document.createElement('div');
        d.className = 'fitem'; d.title = `帧 #${i+1}`; d.draggable = true;
        d.dataset.idx = i;
        const cv = document.createElement('canvas');
        cv.width = C; cv.height = R;
        const c = cv.getContext('2d');
        const id = c.createImageData(C, R);
        for (let r=0; r<R; r++) for (let col=0; col<C; col++) {
            const j = (r*C+col)*4, v = fr.pixels[r][col] ? 255 : 0;
            id.data[j]=v; id.data[j+1]=v; id.data[j+2]=v; id.data[j+3]=255;
        }
        c.putImageData(id, 0, 0);
        d.appendChild(cv);
        const il = document.createElement('span');
        il.className = 'fidx'; il.textContent = i+1; d.appendChild(il);
        const dl = document.createElement('button');
        dl.className = 'fdel'; dl.textContent = '×';
        dl.onclick = e => { e.stopPropagation(); delFr(i); };
        d.appendChild(dl);
        d.onclick = () => { px = fr.pixels.map(r => [...r]); render(); toastMsg(`📂 已加载帧 #${i+1}`); };
        d.ondragstart = () => d.classList.add('dragging');
        d.ondragend = () => {
            d.classList.remove('dragging');
            // Reorder frames array based on DOM order
            const items = [...fl.querySelectorAll('.fitem')];
            frames = items.map(el => frames[parseInt(el.dataset.idx)]);
            // Update dataset indices
            items.forEach((el, idx) => el.dataset.idx = idx);
            // Refresh index labels
            items.forEach((el, idx) => el.querySelector('.fidx').textContent = idx + 1);
        };
        d.ondragover = e => {
            e.preventDefault();
            const dr = fl.querySelector('.dragging');
            if (dr && dr !== d) {
                const box = d.getBoundingClientRect();
                const mid = box.top + box.height / 2;
                fl.insertBefore(dr, e.clientY < mid ? d : d.nextSibling);
            }
        };
        fl.appendChild(d);
    });
}

function playAnimation() {
    if (playing) { stopPlay(); return; }
    if (frames.length < 2) { toastMsg('⚠️ 至少需要 2 帧才能播放'); return; }
    playing = true;
    $('playBtn').textContent = '⏹ 停止';
    $('playBtn').classList.add('btn-dng');
    toastMsg('▶ 播放中...');
    let i = 0;
    const fps = parseInt($('fps').value);
    const step = () => {
        if (!playing) return;
        px = frames[i].pixels.map(r => [...r]);
        render();
        i = (i + 1) % frames.length;
        playTimer = setTimeout(step, 1000 / fps);
    };
    step();
}

function stopPlay() {
    playing = false;
    clearTimeout(playTimer);
    $('playBtn').textContent = '▶ 播放';
    $('playBtn').classList.remove('btn-dng');
}

// ============================================================
//  EXPORT
// ============================================================
function showP(pct, txt) { $('eprog').classList.add('show'); $('pf').style.width = pct + '%'; $('pt').textContent = txt; }
function hideP() { $('eprog').classList.remove('show'); }

function rndFr(fr, c, w, h) {
    for (let r=0; r<R; r++) for (let col=0; col<C; col++) {
        c.fillStyle = fr.pixels[r][col] ? '#fff' : '#000';
        c.fillRect(col*(w/C), r*(h/R), Math.ceil(w/C), Math.ceil(h/R));
    }
}

$('exGif').onclick = async () => {
    if (!frames.length) return;
    if (typeof GIF === 'undefined') { toastMsg('❌ gif.js 未加载'); return; }
    const fps = parseInt($('fps').value), delay = Math.round(100 / fps);
    const w = 848, h = 136;
    showP(0, `编码 GIF (${frames.length}帧 @ ${fps}FPS)...`);
    const gif = new GIF({workers:2, quality:10, width:w, height:h, workerScript:'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'});
    const tc = document.createElement('canvas'); tc.width = w; tc.height = h; const tctx = tc.getContext('2d');
    for (let i=0; i<frames.length; i++) { rndFr(frames[i], tctx, w, h); gif.addFrame(tctx, {copy:true, delay}); showP(Math.round((i+1)/frames.length*50), `帧 ${i+1}/${frames.length}`); }
    showP(60, '合成中...');
    gif.on('progress', p => showP(60+Math.round(p*35), `合成 ${Math.round(p*100)}%`));
    gif.on('finished', blob => {
        showP(100, '下载中...');
        const u = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = u; a.download = `tupper_${frames.length}fps${fps}.gif`; a.click();
        URL.revokeObjectURL(u);
        setTimeout(hideP, 2000);
        toastMsg(`✅ GIF (${(blob.size/1024).toFixed(1)} KB)`);
    });
    gif.render();
};

$('exMp4').onclick = async () => {
    if (!frames.length) return;
    const fps = parseInt($('fps').value), w = 848, h = 136;
    const mts = ['video/mp4','video/webm;codecs=h264,opus','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    let mt = ''; for (const m of mts) { if (MediaRecorder.isTypeSupported(m)) { mt = m; break; } }
    if (!mt) { toastMsg('❌ 不支持视频录制'); return; }
    const ext = mt.includes('mp4') ? 'mp4' : 'webm';
    showP(0, `录制视频 (${frames.length}帧 @ ${fps}FPS)...`);
    const tc = document.createElement('canvas'); tc.width = w; tc.height = h; const tctx = tc.getContext('2d');
    const stream = tc.captureStream(fps);
    const rec = new MediaRecorder(stream, {mimeType: mt});
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = () => {
        const blob = new Blob(chunks, {type: mt});
        const u = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = u; a.download = `tupper_${frames.length}fps${fps}.${ext}`; a.click();
        URL.revokeObjectURL(u);
        showP(100, '下载中...');
        setTimeout(hideP, 2000);
        toastMsg(`✅ 视频 (${(blob.size/1024).toFixed(1)} KB)`);
    };
    rec.start();
    for (let i=0; i<frames.length; i++) { rndFr(frames[i], tctx, w, h); showP(Math.round((i+1)/frames.length*90), `帧 ${i+1}/${frames.length}`); await new Promise(r => setTimeout(r, 1000/fps)); }
    showP(95, '合成中...'); await new Promise(r => setTimeout(r, 300)); rec.stop();
};

init();
