<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赞赏 · AyaseYukio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fdf6e3 0%, #f7e8c3 50%, #f3d98b 100%);
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,.92);
    border-radius: 24px;
    padding: 36px 32px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(180,140,40,.25);
  }
  .card img {
    width: 100%;
    max-width: 340px;
    border-radius: 16px;
    display: block;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    color: #b8860b;
    margin-bottom: 6px;
  }
  p.desc {
    color: #8a7a55;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .back {
    display: inline-block;
    margin-top: 4px;
    padding: 10px 28px;
    border-radius: 999px;
    background: linear-gradient(135deg, #e6b422, #d4930a);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    box-shadow: 0 6px 16px rgba(212,147,10,.35);
    transition: transform .15s;
  }
  .back:hover { transform: translateY(-2px); }
  .tips { margin-top: 16px; font-size: 12px; color: #b0a276; }
</style>
</head>
<body>
  <div class="card">
    <h1>♡ 求赞助 ♡</h1>
    <p class="desc">觉得内容有帮助 / 游戏好玩？请 AyaseYukio 喝杯奶茶吧～</p>
    <img src="appreciate.jpg" alt="AyaseYukio 的赞赏码">
    <a class="back" href="javascript:history.back()">← 返回</a>
    <div class="tips">扫码即可赞赏 · 金额随意 · 心意最重要</div>
  </div>
</body>
</html>
