<!-- 软性植入：不再用置顶横幅挡画面，只在暂停面板底部留一行（游戏内文案，不打断体验） -->
<script>
(function(){
  var HTML = '♡ 这游戏是我一个人做的 · 玩得开心的话 ' +
    '<a href="/Tipping/" target="_blank" rel="noopener" style="color:#5aa6ff;text-decoration:underline;">请我喝杯奶茶</a>' +
    ' · <a href="/" target="_blank" rel="noopener" style="color:#5aa6ff;text-decoration:underline;">回主站逛逛</a>';
  function inject(){
    var p = document.getElementById('pause');
    if(!p || p.querySelector('.softTip')) return !!p;
    var d = document.createElement('div');
    d.className = 'row softTip';
    d.style.cssText = 'opacity:.6;font-size:12px;';
    d.innerHTML = HTML;
    var anchor = document.getElementById('quitBtn');
    if(anchor && anchor.parentNode === p) p.insertBefore(d, anchor); else p.appendChild(d);
    return true;
  }
  var timer = null;
  function boot(){
    if(inject()) return;
    timer = setInterval(function(){ if(inject() && timer) clearInterval(timer); }, 500);
    setTimeout(function(){ if(timer) clearInterval(timer); }, 20000);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
<!-- 真·果蝇脑注入：?fly=1 果蝇自动驾驶人类；?battle=1 对战（你开「它」追果蝇人）；?free=1 逗果蝇沙盒（你飞天、果蝇 6 向漫游）。均需先 node server.js 起 8088 -->
