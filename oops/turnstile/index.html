        <h1>检测到疑似机器人访问</h1>
        <p class="desc">
            系统检测到你的访问特征与自动化程序相似。<br>
            请完成下方验证以继续访问喵～
        </p>

        <div class="turnstile-wrap">
            <!-- Turnstile widget：验证通过后触发 onVerify 回调 -->
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEWu6sT7p_f6A9N0"
                 data-callback="onVerify" data-theme="light" data-language="zh-CN"></div>
        </div>

        <div id="status-msg"></div>

        <div class="tips">
            验证通过后 24 小时内无需重复验证。<br>
            如果你是人类，通常点击一下即可通过；若一直无法通过，请更换浏览器或稍后再试。
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var next = '/';

            // 解析并校验 next 参数（仅允许同站相对路径，防开放重定向）
            try {
                var params = new URLSearchParams(window.location.search);
                var raw = params.get('next') || '/';
                if (typeof raw === 'string' && raw.charAt(0) === '/' && raw.charAt(1) !== '/') {
                    next = raw;
                }
            } catch (e) { /* 保持默认 */ }

            // 显示错误提示（?error= 参数）
            try {
                var err = new URLSearchParams(window.location.search).get('error');
                var statusEl = document.getElementById('status-msg');
                if (err === 'verify-failed') {
                    statusEl.className = 'error';
                    statusEl.textContent = '验证未通过，请重试。';
                } else if (err === 'server-error') {
                    statusEl.className = 'error';
                    statusEl.textContent = '验证服务暂时不可用，请稍后再试。';
                } else if (err === 'missing-token') {
                    statusEl.className = 'error';
                    statusEl.textContent = '未获取到验证结果，请重新验证。';
                }
            } catch (e) { /* ignore */ }

            // Turnstile 验证成功回调
            window.onVerify = function () {
                var statusEl = document.getElementById('status-msg');
                statusEl.className = 'loading';
                statusEl.textContent = '验证中，请稍候...';

                var tokenEl = document.querySelector('[name="cf-turnstile-response"]');
                var token = tokenEl ? tokenEl.value : '';

                // 优先走服务端验证（Cloudflare Pages 部署时 /api/verify-turnstile 可用，
                // 成功会下发 turnstile_pass cookie）
                fetch('/api/verify-turnstile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'cf-turnstile-response=' + encodeURIComponent(token) +
                          '&next=' + encodeURIComponent(next),
                    redirect: 'follow'
                }).then(function (resp) {
                    if (resp.ok || resp.redirected) {
                        // 服务端验证通过（含 302 跟随后的最终页面），直接导航过去
                        window.location.href = resp.url || next;
                    } else {
                        throw new Error('server verify failed: ' + resp.status);
                    }
                }).catch(function () {
                    // GitHub Pages 无服务端（API 404）→ 前端降级：本地标记 + 直接跳回
                    try {
                        localStorage.setItem('turnstile_pass', String(Date.now()));
                        sessionStorage.setItem('auth_passed', 'true');
                    } catch (e) { /* ignore */ }
                    window.location.href = next;
                });
            };
        })();
    </script>
